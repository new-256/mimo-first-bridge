# mimo-indicator — bundle 补丁层（并入主包 mimo-first-bridge）
#
# 本文件由 DSH 插件系统在安装后自动作为 profile 的 bundle 层挂载：
#   dsh plugin --profile web add mimo-first-bridge
# 声明位置: 主包 package.json 的 dsh.bundle.patch。
#
# host 半用裸包名 mimo-first-bridge 解析（主包 package.json main →
# home-plugin/mimo-indicator/lib/index.mjs）；client 半（浏览器）靠
# 主包 package.json 的 dsh.client 声明被宿主 client-modules 自动纳入花名册。
#
# 【关键契约】client.js 的 __ModuleLoader__.load({ id }) 必须 === 主包名
# "mimo-first-bridge"，否则 arrive() 抛 'loaded without registering' 并使
# 整屏插件页崩溃（agy-first-bridge v1.6.1 / codebuddy v1.1.8 同款事故）。
#
# 机器特定配置请写在用户层补丁
#   Windows: %APPDATA%\DSH Desktop\dsh-home\cordis.patch.yml
# 的同 id 行里 — 用户层后应用，按行 id 整体覆盖本行 config。
- insert:
    - id: mimo-indicator
      name: mimo-first-bridge

# ═════════════════════════════════════════════════════════════════════════════
# cordis-mimo 预设声明（对齐 DSH 0.1.6+ bundle patch 预设机制）
#
# 相对行 './mimo-first-bridge.mjs' → 裸子路径 'mimo-first-bridge/preset-plugin'
# （preset mount 的 baseUrl 不指向包内已知目录，相对形态不可移植；
#   裸名走 Node 解析 + package.json exports 子路径，机器无关）
# 修改预设内容时：改 preset/mimo-first/agent.cordis.yml，再跑
#   node scripts/build.mjs
# 重新生成本声明行（scripts/build.mjs 会同步 plugins 块）。
# ═════════════════════════════════════════════════════════════════════════════
- insert:
    - id: preset-cordis-mimo
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cordis-mimo
        name: MiMo-First 执行代理
        description: >-
          完整编码 Agent（standard 全部能力），额外提供 mimo_run/mimo_continue
          工具并注入"MiMo 优先"策略：各种模式下先把实现、编辑、调试、构建、
          跨文件排查派给本机 mimo CLI（Xiaomi MiMo Desktop / MiMoCode，
          DSH 完全控制、mimo 无提示改文件、默认后台执行），原生工具仅用于
          只读查询与最终验证。
        order: 5
        plugins:
          # Placeholder — regenerated by scripts/build.mjs from
          # preset/mimo-first/agent.cordis.yml (bridge row rewritten to
          # bare export subpath mimo-first-bridge/preset-plugin).
          - id: mimo-first-bridge
            name: mimo-first-bridge/preset-plugin
